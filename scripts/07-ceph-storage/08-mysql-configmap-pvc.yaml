# MySQL을 RBD PVC 위 k8s 워크로드로 재배포 — 네임스페이스/설정/스토리지
apiVersion: v1
kind: Namespace
metadata:
  name: mysql
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: mysql
data:
  custom.cnf: |
    [mysqld]
    innodb_buffer_pool_size = 2G
    bind-address = 0.0.0.0
    # 1GbE 위 Ceph RBD라 매 커밋 fsync가 네트워크 왕복을 유발함 — fsync를 1초 단위로
    # 묶어서 커밋 지연을 줄인다. mysqld 크래시엔 안전, OS 크래시 시 최근 1초분 유실 가능.
    innodb_flush_log_at_trx_commit = 2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: mysql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 30Gi
