# CephCluster 정의 — 새 장비 없이 기존 3노드(chan08/chan09/llm001) 재구성
# 사전 조건: 각 노드의 데이터 디바이스가 wipefs로 raw 상태여야 함
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.4
    allowUnsupported: false
  security:
    cephx:
      csi:
        keyType: aes
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  waitTimeoutForHealthyOSDInMinutes: 10
  upgradeOSDRequiresHealthyPGs: false
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    # 노드당 32G 예산이 빠듯해 standby mgr(count 2)는 생략 — mgr는 stateless라 죽어도 재기동되면 그만
    count: 1
    allowMultiplePerNode: false
    modules:
      - name: rook
        enabled: false
  dashboard:
    enabled: true
    ssl: true
  monitoring:
    enabled: false
  network:
    connections:
      encryption:
        enabled: false
      compression:
        enabled: false
      requireMsgr2: false
    # libvirt/QEMU가 pod network 밖(호스트)에서 mon/OSD에 직접 접근해야 하므로 필수
    provider: host
  crashCollector:
    disable: false
  logCollector:
    enabled: true
    periodicity: daily
    maxLogSize: 500M
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
  removeOSDsIfOutAndSafeToRemove: false
  priorityClassNames:
    mon: system-node-critical
    osd: system-node-critical
    mgr: system-cluster-critical
  storage:
    # useAllNodes/useAllDevices 대신 노드별 디바이스를 명시 — OS 디스크(파티션/LVM 사용 중)를 실수로 건드리지 않기 위함
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: "chan08"
        devices:
          - name: "sda1"
      - name: "chan09"
        devices:
          - name: "sda1"
      - name: "llm001"
        devices:
          - name: "nvme0n1p3"
    scheduleAlways: false
    onlyApplyOSDPlacement: false
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  csi:
    readAffinity:
      enabled: false
  healthCheck:
    daemonHealth:
      mon:
        disabled: false
        interval: 45s
      osd:
        disabled: false
        interval: 60s
      status:
        disabled: false
        interval: 60s
    livenessProbe:
      mon:
        disabled: false
      mgr:
        disabled: false
      osd:
        disabled: false
    startupProbe:
      mon:
        disabled: false
      mgr:
        disabled: false
      osd:
        disabled: false
